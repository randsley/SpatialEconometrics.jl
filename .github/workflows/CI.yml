name: CI
on:
  push:
    branches: [master, main]
    tags: ['*']
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'      # latest stable
          - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          - version: '1'
            os: windows-latest
            arch: x64
          - version: '1'
            os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v4
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The weak dependencies are deliberately absent from [targets].test, so a
  # plain `Pkg.test()` does not have to build Makie and Turing. Testsets 25
  # and 26 skip themselves when those packages are missing, so this job runs
  # the suite in an environment that installs them, alongside the direct
  # dependencies runtests.jl needs in order to `using` them.
  extensions:
    name: Package extensions (Makie + Turing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v2
      # Pkg 1.13.0 bug, not a fault in this package. When a dev'd package
      # declares [extensions], the auto-precompile at the end of Pkg.add
      # hands the precompiler a newly installed *indirect* dependency by bare
      # name; Base.identify_package resolves only direct deps and returns
      # nothing, so precompilation.jl:720 throws "Unknown package:
      # SpecialFunctions" -- after the install has already succeeded.
      # Reproduced with a two-line package whose only content is a [weakdeps]
      # /[extensions] pair; it goes away if those are removed, if nothing is
      # dev'd, or if precompilation runs as its own call. So the add defers
      # precompilation and the next step does it.
      - name: Build an environment with both weak dependencies
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          mkdir -p ext-test-env
          julia --project=ext-test-env -e '
            using Pkg
            Pkg.develop(PackageSpec(path = pwd()))
            Pkg.add(["Test", "ForwardDiff", "ChainRulesCore", "StatsAPI",
                     "StatsModels", "Tables", "NearestNeighbors",
                     "Makie", "Turing", "Distributions"])'
      - name: Precompile the environment
        run: julia --project=ext-test-env -e 'using Pkg; Pkg.precompile()'
      # Without this guard a failure to precompile either extension would
      # merely skip testsets 25 and 26 and leave the job green.
      - name: Check that both extensions actually load
        run: |
          julia --project=ext-test-env -e '
            using SpatialEconometrics, Makie, Turing, Distributions
            for ext in (:SpatialEconometricsMakieExt, :SpatialEconometricsTuringExt)
                isnothing(Base.get_extension(SpatialEconometrics, ext)) &&
                    error("$ext did not load")
            end
            @info "extensions loaded" makie = pkgversion(Makie) turing = pkgversion(Turing)'
      - name: Run the full suite with the extensions live
        run: julia --project=ext-test-env test/runtests.jl

  # drift-check.yml in randsley/spatial-econometrics-book names
  # `repository_dispatch: [package-updated]` as its real trigger, but nothing
  # sent that event until 2026-11-06: the book's only live trigger was its
  # Monday cron, so a breaking change here could sit undetected in the
  # published book for up to seven days. This job sends it, and only after
  # both test jobs are green, so the book never re-executes against a commit
  # this repository already knows is broken.
  #
  # The default GITHUB_TOKEN cannot dispatch to another repository, so this
  # needs a PAT with `repo` scope (or a fine-grained token with Contents:
  # write on the book repo) stored here as BOOK_DISPATCH_TOKEN. Without it
  # the job warns and passes rather than failing: a missing notification is
  # not a reason to call this package's own CI red.
  notify-book:
    name: Tell the book the package changed
    needs: [test, extensions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      BOOK_DISPATCH_TOKEN: ${{ secrets.BOOK_DISPATCH_TOKEN }}
    steps:
      # Needed only so the step below can read the version out of
      # Project.toml; the dispatch itself carries no repository content.
      - uses: actions/checkout@v4

      - name: Read the package version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Project.toml)
          echo "PKG_VERSION=$v" >> "$GITHUB_ENV"

      - name: Dispatch package-updated to the book
        if: env.BOOK_DISPATCH_TOKEN != ''
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $BOOK_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/randsley/spatial-econometrics-book/dispatches \
            -d "{\"event_type\":\"package-updated\",\"client_payload\":{\"sha\":\"${{ github.sha }}\",\"version\":\"$PKG_VERSION\"}}"

      - name: Say why nothing was sent
        if: env.BOOK_DISPATCH_TOKEN == ''
        run: |
          echo "::warning title=Book not notified::BOOK_DISPATCH_TOKEN is unset, so no package-updated dispatch was sent. The book's weekly cron remains its only drift trigger."
